name: Validate macOS app
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test scripts, persistence and native highlighting
        run: swift test
      - name: Build and verify signed app
        run: zsh scripts/build-app.sh
      - name: Check packaged highlighter resources
        run: |
          dist/HighlighterValidation/OhMyBoop.app/Contents/MacOS/OhMyBoop --validate-highlighter /tmp/highlighter-resources.json
          cat /tmp/highlighter-resources.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: highlighting-previews
          path: /tmp/ohmyboop-highlighting-*.png
          if-no-files-found: ignore
