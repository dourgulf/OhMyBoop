name: OhMyBoop
options:
  bundleIdPrefix: dev.lidawen
  deploymentTarget:
    macOS: "14.0"
packages:
  HighlighterSwift:
    url: https://github.com/smittytone/HighlighterSwift.git
    exactVersion: 3.1.0
targets:
  OhMyBoop:
    type: application
    platform: macOS
    sources:
      - path: Sources/OhMyBoop
        excludes: [Resources]
      - path: Sources/OhMyBoop/Resources/scripts
        type: folder
        buildPhase: resources
      - path: Sources/OhMyBoop/Resources/ThirdPartyNotices.txt
        buildPhase: resources
    dependencies:
      - package: HighlighterSwift
        product: Highlighter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.lidawen.OhMyBoop
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: OhMyBoop
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 lidawen"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
schemes:
  OhMyBoop:
    build:
      targets:
        OhMyBoop: all
